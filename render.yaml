services:
  - type: web
    name: panotic-backend
    runtime: docker
    repo: https://github.com/votre-org/panotic
    branch: main
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true
