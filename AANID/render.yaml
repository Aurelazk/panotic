# AANID — Infrastructure as Code (Render Blueprint)
# Docs : AANID/docs/DEPLOY.md

services:
  - type: web
    name: aanid-api
    runtime: node
    rootDir: AANID
    plan: free
    buildCommand: >-
      npm install &&
      npm run prisma:generate -w backend &&
      if [ -n "$DATABASE_URL" ]; then npm run prisma:push -w backend; else echo "DATABASE_URL absent — skip prisma push"; fi
    startCommand: npm start -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AANID_ACCESS_SECRET
        generateValue: true
      - key: AANID_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 10000
