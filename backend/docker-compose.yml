version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: panotic-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-panotic_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-panotic_pass123}
      POSTGRES_DB: ${DATABASE_NAME:-panotic}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: panotic-api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-panotic_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-panotic_pass123}
      DATABASE_NAME: ${DATABASE_NAME:-panotic}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_123}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
